<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Veggie Slice - A multiplayer vegetable slicing party game!">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Veggie Slice - Party Games</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥒</text></svg>">
    <link rel="stylesheet" href="../../css/shared.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <a href="../../" class="home-btn" title="Back to Games">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
    </a>

    <div id="app">
        <!-- Welcome Screen -->
        <div id="screen-welcome" class="screen active">
            <div class="screen-content">
                <div class="logo">
                    <span class="logo-icon">🥒</span>
                    <h1 class="logo-text">Veggie Slice</h1>
                </div>
                <p class="tagline">Swipe to slice vegetables together!</p>

                <div class="rules-card">
                    <h2>How to Play</h2>
                    <ul class="rules-list">
                        <li><span class="rule-icon">1</span> Each player gets their own zone on screen</li>
                        <li><span class="rule-icon">2</span> Swipe through vegetables to slice them</li>
                        <li><span class="rule-icon">3</span> Don't miss! 3 drops and you're out</li>
                        <li><span class="rule-icon">4</span> Everyone plays at the same time</li>
                    </ul>
                </div>

                <button class="btn btn-primary btn-large" onclick="Game.showSetup()">
                    Start Game
                </button>
            </div>
        </div>

        <!-- Setup Screen -->
        <div id="screen-setup" class="screen">
            <div class="screen-content">
                <h2 class="screen-title">Game Setup</h2>

                <div class="setup-card">
                    <label class="setup-label">Players</label>
                    <div class="player-selector">
                        <button class="btn btn-icon" onclick="Game.adjustPlayers(-1)">-</button>
                        <span id="player-count" class="player-count">2</span>
                        <button class="btn btn-icon" onclick="Game.adjustPlayers(1)">+</button>
                    </div>
                    <div class="player-preview" id="player-preview"></div>
                </div>

                <div class="setup-card">
                    <label class="setup-label">Game Duration</label>
                    <div class="duration-options" id="duration-options">
                        <button class="btn btn-option active" data-duration="60" onclick="Game.setDuration(60)">60s</button>
                        <button class="btn btn-option" data-duration="90" onclick="Game.setDuration(90)">90s</button>
                        <button class="btn btn-option" data-duration="120" onclick="Game.setDuration(120)">2 min</button>
                    </div>
                </div>

                <div class="setup-card">
                    <label class="setup-label">Difficulty</label>
                    <div class="duration-options" id="difficulty-options">
                        <button class="btn btn-option" data-difficulty="easy" onclick="Game.setDifficulty('easy')">Easy</button>
                        <button class="btn btn-option active" data-difficulty="normal" onclick="Game.setDifficulty('normal')">Normal</button>
                        <button class="btn btn-option" data-difficulty="hard" onclick="Game.setDifficulty('hard')">Hard</button>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn btn-secondary" onclick="Game.showWelcome()">Back</button>
                    <button class="btn btn-primary" onclick="Game.startGame()">Slice!</button>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="screen-game" class="screen">
            <canvas id="game-canvas"></canvas>
            <div id="game-hud"></div>
        </div>

        <!-- Results Screen -->
        <div id="screen-results" class="screen">
            <div class="screen-content center-content">
                <h1 class="results-title">Time's Up!</h1>
                <div id="results-board" class="results-board"></div>
                <div class="button-group vertical">
                    <button class="btn btn-primary btn-large" onclick="Game.startGame()">
                        Play Again
                    </button>
                    <button class="btn btn-secondary" onclick="Game.showSetup()">
                        Change Settings
                    </button>
                    <button class="btn btn-secondary" onclick="window.location.href='../../'">
                        All Games
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
